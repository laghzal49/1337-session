name: Neovim visual screenshot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshot:
    name: Capture real Neovim UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install current Neovim
        run: |
          curl -fsSL --retry 3 https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz -o /tmp/neovim.tar.gz
          tar -xzf /tmp/neovim.tar.gz -C /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Verify offline runtime portability
        run: make runtime
      - name: Install image capture requirements
        run: python3 -m pip install --user Pillow msgpack
      - name: Capture editor screenshot
        run: python3 scripts/capture-nvim.py --output nvim-rose-preview.png
      - name: Prepare full Neovim configuration
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          ln -s "$GITHUB_WORKSPACE/nvim" "$RUNNER_TEMP/config/nvim"
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" NVIM_BLACK_DOCS_AUTO_UPDATE=0 \
            NVIM_BOOTSTRAP_MODE=plugins NVIM_BOOTSTRAP_SCRIPT="$GITHUB_WORKSPACE/scripts/nvim-bootstrap.lua" \
            timeout 240 nvim --headless --cmd 'let g:station_1337 = v:false' \
            -c 'lua dofile(vim.env.NVIM_BOOTSTRAP_SCRIPT)'
      - name: Verify rose palette and statusline
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          NVIM_COLOR_STYLE=rose NVIM_BLACK_DOCS_AUTO_UPDATE=0 \
            nvim --headless --cmd 'let g:station_1337 = v:false' \
            -c 'lua dofile("nvim/tests/rose_polish_review.lua")' -c 'qa!'
      - name: Capture all four real 1337-session views
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          python3 scripts/capture-nvim.py --full --view editor --output nvim-rose-full-preview.png --timeout 60
          python3 scripts/capture-nvim.py --full --view explorer --output nvim-rose-explorer.png --timeout 60
          python3 scripts/capture-nvim.py --full --view completion --output nvim-rose-completion.png --timeout 60
          python3 scripts/capture-nvim.py --full --view documentation --output nvim-rose-documentation.png --timeout 60
      - name: Verify screenshots are distinct and legible
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageChops
          files = ['nvim-rose-full-preview.png', 'nvim-rose-explorer.png',
                   'nvim-rose-completion.png', 'nvim-rose-documentation.png']
          images = [Image.open(path).convert('RGB') for path in files]
          assert all(im.width >= 1000 and im.height >= 700 for im in images)
          for im in images[1:]:
              assert ImageChops.difference(images[0], im).getbbox(), 'Panel screenshot equals editor'
          print('VISUAL QA PASS: 4 real distinct Neovim captures')
          PY
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: neovim-rose-preview
          path: |
            nvim-rose-preview.png
            nvim-rose-full-preview.png
            nvim-rose-explorer.png
            nvim-rose-completion.png
            nvim-rose-documentation.png
          retention-days: 30
