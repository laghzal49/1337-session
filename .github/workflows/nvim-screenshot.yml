name: Neovim visual screenshot

on:
  pull_request:
  push:
    branches: [main, feat/nvimz-inspired-ui]
  workflow_dispatch:

jobs:
  screenshot:
    name: Capture real Neovim UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install current Neovim
        run: |
          curl -fsSL --retry 3 https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz -o /tmp/neovim.tar.gz
          tar -xzf /tmp/neovim.tar.gz -C /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Verify offline runtime portability
        run: make runtime
      - name: Install image capture requirements
        run: python3 -m pip install --user Pillow msgpack
      - name: Capture editor screenshot
        run: python3 scripts/capture-nvim.py --output nvim-rose-preview.png
      - name: Prepare full Neovim configuration
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          ln -s "$GITHUB_WORKSPACE/nvim" "$RUNNER_TEMP/config/nvim"
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" NVIM_BLACK_DOCS_AUTO_UPDATE=0 \
            NVIM_BOOTSTRAP_MODE=plugins NVIM_BOOTSTRAP_SCRIPT="$GITHUB_WORKSPACE/scripts/nvim-bootstrap.lua" \
            timeout 240 nvim --headless --cmd 'let g:station_1337 = v:false' \
            -c 'lua dofile(vim.env.NVIM_BOOTSTRAP_SCRIPT)'
      - name: Verify rose palette and statusline
        if: github.ref == 'refs/heads/main'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          NVIM_COLOR_STYLE=rose NVIM_BLACK_DOCS_AUTO_UPDATE=0 \
            nvim --headless --cmd 'let g:station_1337 = v:false' \
            -c 'lua dofile("nvim/tests/rose_polish_review.lua")' -c 'qa!'
      - name: Verify nvimz Moon UI and editor integration
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          NVIM_COLOR_STYLE=nvimz NVIM_BLACK_DOCS_AUTO_UPDATE=0 \
            nvim --headless --cmd 'let g:station_1337 = v:false' \
            -c 'lua dofile("nvim/tests/nvimz_ui_review.lua")' -c 'qa!'
      - name: Capture all four real 1337-session views
        if: github.ref == 'refs/heads/main'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          python3 scripts/capture-nvim.py --full --view editor --output nvim-rose-full-preview.png --timeout 60
          python3 scripts/capture-nvim.py --full --view explorer --output nvim-rose-explorer.png --timeout 60
          python3 scripts/capture-nvim.py --full --view completion --output nvim-rose-completion.png --timeout 60
          python3 scripts/capture-nvim.py --full --view documentation --output nvim-rose-documentation.png --timeout 60
      - name: Check Python syntax highlighting fallback
        if: github.ref == 'refs/heads/feat/nvimz-inspired-ui'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          NVIM_COLOR_STYLE=nvimz NVIM_BLACK_DOCS_AUTO_UPDATE=0 \
            nvim --headless --cmd 'let g:station_1337 = v:false' \
            -c 'lua dofile("nvim/tests/python_highlighting_review.lua")' -c 'qa!'
      - name: Capture nvimz dashboard and editor
        if: github.ref == 'refs/heads/feat/nvimz-inspired-ui'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          NVIM_COLOR_STYLE: nvimz
        run: |
          python3 scripts/capture-nvim.py --full --view dashboard --output nvimz-dashboard.png --timeout 60
          python3 scripts/capture-nvim.py --full --view editor --output nvimz-editor.png --timeout 60
          python3 scripts/capture-nvim.py --full --view editor --language python --output nvimz-python.png --timeout 60
      - name: Capture nvimz Oil explorer and native picker
        if: github.ref == 'refs/heads/feat/nvimz-inspired-ui'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          NVIM_COLOR_STYLE: nvimz
        run: |
          python3 scripts/capture-nvim.py --full --view explorer --output nvimz-explorer.png --timeout 60
          python3 scripts/capture-nvim.py --full --view picker --output nvimz-picker.png --timeout 60
      - name: Capture completion UI
        if: github.ref == 'refs/heads/feat/nvimz-inspired-ui'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          NVIM_COLOR_STYLE: nvimz
        run: |
          python3 scripts/capture-nvim.py --full --view completion --output nvimz-completion.png --timeout 60
      - name: Verify screenshots are distinct and legible
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageChops
          files = ['nvim-rose-full-preview.png', 'nvim-rose-explorer.png',
                   'nvim-rose-completion.png', 'nvim-rose-documentation.png']
          images = [Image.open(path).convert('RGB') for path in files]
          assert all(im.width >= 1000 and im.height >= 700 for im in images)
          for im in images[1:]:
              assert ImageChops.difference(images[0], im).getbbox(), 'Panel screenshot equals editor'
          print('VISUAL QA PASS: 4 real distinct Neovim captures')
          PY
      - name: Verify six nvimz UI screenshots (including Python)
        if: github.ref == 'refs/heads/feat/nvimz-inspired-ui'
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageChops
          names = ['dashboard','editor','python','explorer','picker','completion']
          images = [Image.open(f'nvimz-{name}.png').convert('RGB') for name in names]
          assert all(im.width >= 1000 and im.height >= 700 for im in images)
          for i in range(1, len(images)):
              assert ImageChops.difference(images[0], images[i]).getbbox(), (
                  'Screenshot equals dashboard: ' + names[i]
              )
          # The Python sample contains a class, a regular function, an
          # indented method, and __init__; all four colors must be visible.
          py = images[names.index('python')]
          from collections import Counter
          counts = Counter(py.getdata())
          for label, rgb in {
              'class': (199, 146, 234),
              'function': (130, 170, 255),
              'method': (79, 214, 190),
              '__init__': (255, 203, 107),
          }.items():
              assert sum(n for color, n in counts.items() if
                         max(abs(color[i] - rgb[i]) for i in range(3)) <= 8) > 5, (
                  f'Python {label} color is missing from real screenshot'
              )
          print('NVIMZ VISUAL QA PASS: dashboard, editor, Python declarations, Oil, picker, completion')
          PY
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neovim-visual-previews
          path: |
            nvim-rose-preview.png
            nvim-rose-full-preview.png
            nvim-rose-explorer.png
            nvim-rose-completion.png
            nvim-rose-documentation.png
            nvimz-dashboard.png
            nvimz-editor.png
            nvimz-python.png
            nvimz-explorer.png
            nvimz-picker.png
            nvimz-completion.png
          retention-days: 30
