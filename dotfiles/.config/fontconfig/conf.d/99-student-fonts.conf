<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias><family>monospace</family><prefer><family>Maple Mono NF</family></prefer></alias>
  <match target="pattern">
    <test name="family" compare="eq"><string>Student Italic</string></test>
    <edit name="family" mode="assign"><string>Maple Mono NF</string></edit>
    <edit name="slant" mode="assign"><const>italic</const></edit>
  </match>
</fontconfig>
