background_opacity          1.0
# Animate single-cell h/j/k/l cursor movement in the GPU renderer.
cursor_trail                1
cursor_trail_start_threshold 1
cursor_trail_decay          0.06 0.10
window_padding_width        12

include themes/electrovoid.conf
cursor_trail_color          none

# JetBrains Mono with Nerd Font icons, italic by default.
bold_font JetBrainsMonoNF-BoldItalic
italic_font JetBrainsMonoNF-Italic
bold_italic_font JetBrainsMonoNF-BoldItalic
font_family JetBrainsMonoNF-Italic
font_size 12.0

scrollback_lines 10000
enable_audio_bell no
hide_window_decorations yes
tab_bar_style powerline
tab_powerline_style slanted

shell /usr/bin/zsh -l
