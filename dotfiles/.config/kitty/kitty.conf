background_opacity          1.0
cursor_trail                0
window_padding_width        12

include themes/noctalia.conf

# JetBrains Mono with Nerd Font icons, italic by default.
bold_font JetBrainsMonoNFM-BoldItalic
italic_font JetBrainsMonoNFM-Italic
bold_italic_font JetBrainsMonoNFM-BoldItalic
font_family JetBrainsMonoNFM-Italic
font_size 13.0

background #000000
foreground #dddddd
cursor #dddddd
selection_background #303030
selection_foreground #ffffff
scrollback_lines 10000
enable_audio_bell no
hide_window_decorations yes
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background #303030
active_tab_foreground #ffffff
inactive_tab_background #000000
inactive_tab_foreground #999999

# Readable syntax colors on a true-black canvas.
color0 #161616
color1 #ef8585
color2 #a3c99c
color3 #d6bf8f
color4 #91b4d5
color5 #bda3d1
color6 #91c7c7
color7 #dddddd
color8 #666666
color9 #ef8585
color10 #a3c99c
color11 #d6bf8f
color12 #91b4d5
color13 #bda3d1
color14 #91c7c7
color15 #ffffff

shell /usr/bin/zsh -l
