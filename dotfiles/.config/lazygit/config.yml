gui:
  nerdFontsVersion: "3"
  border: rounded
  showFileTree: true
  theme:
    activeBorderColor: [white, bold]
    inactiveBorderColor: ['#444444']
    selectedLineBgColor: ['#202020']
    defaultFgColor: ['#dddddd']
    unstagedChangesColor: ['#ef8585']
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
