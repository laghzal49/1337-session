set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-kitty:RGB,xterm-256color:RGB,alacritty:RGB'
set -g default-shell /usr/bin/zsh
set -g mouse on
set -g history-limit 20000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-style 'bg=#101010,fg=#ffffff'
set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#8800ff'
set -g status-left ' #S  '
set -g status-right ' %H:%M '
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# ElectroVoid active window and pane accents.
set -g window-status-current-style 'bg=#3b0066,fg=#bb00ff'
set -g message-style 'bg=#141414,fg=#ffffff'
set -g mode-style 'bg=#2d003d,fg=#ffffff'
