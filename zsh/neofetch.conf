# ~/.config/neofetch/config.conf — Carbon/oxocarbon-styled neofetch
# Minimal, fast, matches the nvim setup (cyan/purple/pink accents).

print_info() {
    prin "$(color 5)╭─────────────  1337 session ─────────────"
    info "$(color 6) user" title
    info "$(color 6) os" distro
    info "$(color 6) kernel" kernel
    info "$(color 6) uptime" uptime
    info "$(color 5) shell" shell
    info "$(color 5) term" term
    info "$(color 5) font" term_font
    info "$(color 13) pkgs" packages
    info "$(color 13) mem" memory
    prin "$(color 5)╰──────────────────────────────────────────"
    info cols
}

# title: user@host, no fqdn
title_fqdn="off"

# trim kernel/distro strings
kernel_shorthand="on"
distro_shorthand="off"
os_arch="off"

# uptime like "2h 33m"
uptime_shorthand="tiny"

# memory as used/total GiB
memory_percent="off"
memory_unit="gib"

# packages count only, with manager names
package_managers="on"

# shell without version path noise
shell_path="off"
shell_version="on"

# color blocks: slim strip
block_range=(0 15)
block_width=2
block_height=1
col_offset="auto"

# separator between key and value
separator="  "

# ascii: distro logo in Carbon-ish colors (magenta/cyan)
image_backend="ascii"
ascii_distro="auto"
ascii_colors=(5 6 13 4 7 1)
ascii_bold="on"

# layout
gap=4

# underline off; bold keys
underline_enabled="off"
bold="on"

# misc perf
cpu_temp="off"
refresh_rate="off"
